<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<title>Entrar · B.O.N.E</title>
<link rel="icon" type="image/png" href="/icone.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<!--
  B.O.N.E · tela de entrada (v3.82). Só uma ação: Entrar com o Zoho. Página sozinha (CSS e JS aqui dentro):
  sem login, o servidor só deixa passar esta página, as fontes e o ícone.
  Fundo: "Cursor Ring Field" do Originkit (o Zion tem conta lá), refeito em JavaScript puro, sem React, com o
  preset que ele mandou (grafite #1E1E1E e amarelo #FFC100). Só roda aqui, no navegador; para quando a aba some,
  quando o mouse fica parado e com "reduzir movimento" ligado.
  Letras rolando no botão e no nome: ideia do Skiper58 (TextRoll, Skiper UI), refeita em CSS puro.
-->
<style>
  @font-face{font-family:"Inter"; src:url(/fonts/inter.woff2) format("woff2"); font-weight:100 900; font-style:normal; font-display:swap}
  :root{
    --fundo:#0A0A0B; --ink:#FFFFFF; --ink-2:rgba(235,235,245,.78); --ink-3:rgba(235,235,245,.6);
    --amarelo:#FFC100; --vidro:rgba(20,20,22,.72); --borda:rgba(255,255,255,.09); --erro:#FF6961;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0}
  body{background:var(--fundo); color:var(--ink); font-family:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden}
  /* fundo: o campo de anéis ocupa a tela toda (o preset tem um véu branco de 6% por cima do preto) */
  #campo{position:fixed; inset:0; background:#FFFFFF0F}
  #campo canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
  #campo.sem-gl{background:radial-gradient(60% 55% at 35% 45%, rgba(255,193,0,.16), transparent 70%), radial-gradient(40% 40% at 70% 70%, rgba(255,193,0,.06), transparent 70%), #111}
  /* cartão à direita */
  .lado{position:fixed; inset:0; display:flex; align-items:center; justify-content:flex-end; padding:24px max(24px, 8vw) 24px 24px; pointer-events:none}
  .cartao{pointer-events:auto; width:min(400px, 100%); padding:36px 32px 28px; border-radius:26px; background:var(--vidro);
    -webkit-backdrop-filter:saturate(160%) blur(22px); backdrop-filter:saturate(160%) blur(22px);
    border:1px solid var(--borda); box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    display:flex; flex-direction:column; gap:22px; animation:entra .6s cubic-bezier(.2,.8,.2,1) both}
  @keyframes entra{from{opacity:0; transform:translateY(14px) scale(.985)} to{opacity:1; transform:none}}
  .marca{display:flex; align-items:center; gap:14px}
  .logo{width:46px; height:46px; border-radius:13px; flex:none; display:grid; place-items:center; font-weight:800; font-size:16px; letter-spacing:-.02em; color:#000;
    background:linear-gradient(180deg, #FFD54D, var(--amarelo)); box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 6px 18px rgba(255,193,0,.25)}
  .nome{display:flex; flex-direction:column; gap:6px; min-width:0}
  .nome h1{margin:0; font-size:40px; line-height:1; font-weight:800; letter-spacing:-.03em; cursor:default}
  .nome p{margin:0; font-size:13px; color:var(--ink-3); line-height:1.3}
  .texto{margin:0; font-size:14px; line-height:1.55; color:var(--ink-2)}
  .entrar{display:flex; align-items:center; justify-content:center; gap:12px; height:54px; border-radius:15px; text-decoration:none;
    background:var(--amarelo); color:#000; font-weight:800; font-size:14px; letter-spacing:.02em; text-transform:uppercase;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 10px 26px rgba(255,193,0,.22); transition:transform .15s, box-shadow .25s, filter .25s}
  .entrar:hover{filter:brightness(1.05); box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 14px 34px rgba(255,193,0,.32)}
  .entrar:active{transform:scale(.98)}
  .entrar:focus-visible{outline:3px solid rgba(255,193,0,.55); outline-offset:3px}
  .entrar svg{width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .entrar:hover svg,.entrar:focus-visible svg{transform:translateX(3px)}
  .entrar.indo{pointer-events:none; filter:saturate(.7) brightness(.95)}
  .nota{margin:0; font-size:12px; line-height:1.5; color:var(--ink-3)}
  .erro{margin:0; padding:10px 12px; border-radius:12px; font-size:13px; line-height:1.45; color:#fff; background:rgba(255,69,58,.16); border:1px solid rgba(255,105,97,.35); display:flex; gap:9px}
  .erro[hidden]{display:none}
  .erro svg{width:16px; height:16px; flex:none; margin-top:1px; fill:none; stroke:var(--erro); stroke-width:2; stroke-linecap:round}
  .rodape{font-size:11px; color:rgba(235,235,245,.35); display:flex; justify-content:space-between; gap:8px}
  /* letras rolando (ideia do Skiper58 / TextRoll, Skiper UI): cada letra sobe e a cópia de baixo entra no lugar,
     com atraso crescendo do meio pras pontas */
  .roll{position:relative; display:inline-block; overflow:hidden; vertical-align:top; line-height:1}
  .roll .ra,.roll .rb{display:block; white-space:pre}
  .roll .rb{position:absolute; inset:0}
  .roll i{display:inline-block; font-style:normal; transition:transform .38s cubic-bezier(.45,0,.55,1) var(--d, 0s)}
  .roll .rb i{transform:translateY(105%)}
  :is(.rola:hover, .rola:focus-visible) .roll .ra i{transform:translateY(-105%)}
  :is(.rola:hover, .rola:focus-visible) .roll .rb i{transform:none}
  @media (max-width:760px){
    .lado{justify-content:center; align-items:flex-end; padding:16px 16px calc(16px + env(safe-area-inset-bottom, 0px))}
    .cartao{padding:28px 22px 22px; gap:18px}
    .nome h1{font-size:34px}
  }
  @media (prefers-reduced-motion: reduce){
    .cartao{animation:none}
    .roll i{transition:none}
    :is(.rola:hover, .rola:focus-visible) .roll .ra i{transform:none}
    :is(.rola:hover, .rola:focus-visible) .roll .rb i{transform:translateY(105%)}
  }
</style>
</head>
<body>
<div id="campo" aria-hidden="true"><canvas id="tela"></canvas></div>
<main class="lado">
  <section class="cartao" aria-labelledby="titulo">
    <div class="marca">
      <div class="logo" aria-hidden="true">SB</div>
      <div class="nome rola" tabindex="-1">
        <h1 id="titulo" aria-label="B.O.N.E"><span class="roll" data-roll="B.O.N.E"></span></h1>
        <p>Bora Organizar Nossas Entregas · Grupo SB</p>
      </div>
    </div>
    <p class="texto">O planejamento dos posts de todas as empresas do grupo, num lugar só. Entre com a conta do Zoho da empresa.</p>
    <p class="erro" id="erro" role="alert" hidden></p>
    <a class="entrar rola" id="entrar" href="/auth/zoho" aria-label="Entrar com o Zoho">
      <span class="roll" data-roll="Entrar com o Zoho"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>
    <p class="nota">Vale o e-mail da SeuBoné ou do Grupo Quatro5 que já está liberado no painel. Não precisa de senha nova.</p>
    <div class="rodape"><span>Grupo SB</span><span>B.O.N.E</span></div>
  </section>
</main>
<script>
'use strict';
// ---------------- letras rolando ----------------
(function () {
  const PASSO = 0.035;                                         // o mesmo passo do Skiper58
  document.querySelectorAll('.roll[data-roll]').forEach(el => {
    const txt = el.dataset.roll, n = txt.length;
    const letras = camada => [...txt].map((c, i) => '<i style="--d:' + (PASSO * Math.abs(i - (n - 1) / 2)).toFixed(3) + 's">' + (c === ' ' ? '&nbsp;' : c.replace(/[&<>]/g, x => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[x]))) + '</i>').join('');
    el.innerHTML = '<span class="ra">' + letras() + '</span><span class="rb" aria-hidden="true">' + letras() + '</span>';
    el.setAttribute('aria-hidden', 'true');
  });
})();

// ---------------- mensagens de erro que o servidor manda na volta do Zoho ----------------
(function () {
  const ERROS = {
    'sem-acesso': 'Essa conta do Zoho não está liberada no B.O.N.E. Entre com o e-mail da empresa ou peça pro Zion liberar.',
    'cancelado': 'O login foi cancelado no Zoho. É só tentar de novo.',
    'estado': 'A tela de entrada ficou aberta tempo demais. Clique em Entrar com o Zoho de novo.',
    'token': 'O Zoho não confirmou o login agora. Tente de novo em instantes.',
    'zoho': 'Não consegui falar com o Zoho agora. Tente de novo em instantes.',
    'verificado': 'O e-mail dessa conta ainda não foi verificado no Zoho.',
    'desligado': 'O login pelo Zoho ainda não foi configurado no servidor.',
  };
  const cod = new URLSearchParams(location.search).get('erro');
  if (cod) {
    const el = document.getElementById('erro');
    el.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg><span></span>';
    el.querySelector('span').textContent = ERROS[cod] || 'Não deu pra entrar agora. Tente de novo.';
    el.hidden = false;
    try { history.replaceState(null, '', '/login' + location.hash); } catch (e) {}
  }
  // quem abriu um link direto (ex.: um documento) volta pra ele depois do login
  const entrar = document.getElementById('entrar');
  entrar.addEventListener('click', () => {
    try { if (location.hash && location.hash.length > 1) sessionStorage.setItem('bone.volta', location.hash); } catch (e) {}
    entrar.classList.add('indo');
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && document.activeElement === document.body) entrar.click(); });
})();

// ---------------- fundo: campo de anéis (Cursor Ring Field, Originkit, em WebGL puro) ----------------
(function () {
  // preset que o Zion mandou
  const PRESET = { colors: ['#1E1E1E', '#FFC100'], density: 140, dotSize: 65, speed: 0, cameraDistance: 420, ring: { push: 50, width: 9, radius: 12, turbulence: 100 } };
  const FIELD = 500, HALF = FIELD / 2, WORLD = 5, CURSOR_REACH = 0.175;
  const CURSOR_LERP = 0.12, WANDER_LERP = 0.01, HANDOVER_LERP = 0.08, CURSOR_JITTER = 0.01;
  const FOV = 40, DPR_CAP = 2, MAX_POINTS = 65536, TAU = Math.PI * 2, MAX_COLORS = 5, RING_EDGE = 4;
  const REDUZ = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();

  const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(
      i.z+vec4(0.0,i1.z,i2.z,1.0))
    + i.y+vec4(0.0,i1.y,i2.y,1.0))
    + i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
`;
  const FIELD_TERMS = `
void fieldTerms(vec2 ref, vec2 ringPos, float time, float ringRadius, float w1, float w2, float turb,
    out vec2 disp, out float bandT, out float bandHot){
    float dist = distance(ref, ringPos);
    float n0 = snoise(vec3(ref * 0.2 + vec2(18.4924, 72.9744), time * 0.5));
    float dist1 = distance(ref + (n0 * 0.005), ringPos);
    float t  = smoothstep(ringRadius - (w1 * 2.0), ringRadius, dist) - smoothstep(ringRadius, ringRadius + w1, dist1);
    float t2 = smoothstep(ringRadius - (w2 * 2.0), ringRadius, dist) - smoothstep(ringRadius, ringRadius + w2, dist1);
    float t3 = smoothstep(ringRadius + w2, ringRadius, dist);
    t  = pow(max(t, 0.0), 2.0);
    t2 = pow(max(t2, 0.0), 3.0);
    t += t2 * 3.0;
    t += t3 * 0.4;
    t += snoise(vec3(ref * 30.0 + vec2(11.4924, 12.9744), time * 0.5)) * t3 * 0.5;
    float nS = snoise(vec3(ref * 2.0 + vec2(18.4924, 72.9744), time * 0.5));
    t += pow((nS + 1.5) * 0.5, 2.0) * 0.6;
    float n1 = snoise(vec3(ref * 4.0 + vec2(88.494, 32.4397), time * 0.35));
    float n2 = snoise(vec3(ref * 4.0 + vec2(50.904, 120.947), time * 0.35));
    float n3 = snoise(vec3(ref * 20.0 + vec2(18.4924, 72.9744), time * 0.5));
    float n4 = snoise(vec3(ref * 20.0 + vec2(50.904, 120.947), time * 0.5));
    vec2 d = vec2(n1, n2) * 0.03 + vec2(n3, n4) * 0.005;
    d.x += sin((ref.x * 20.0) + (time * 4.0)) * 0.02 * clamp(dist, 0.0, 1.0);
    d.y += cos((ref.y * 20.0) + (time * 3.0)) * 0.02 * clamp(dist, 0.0, 1.0);
    disp = d * turb;
    bandT = t;
    bandHot = t2;
}
`;
  const SIM_VERT = `
precision highp float;
attribute vec2 aPos;
varying vec2 vUV;
void main(){ vUV = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }
`;
  const SIM_FRAG = `
precision highp float;
uniform sampler2D uState;
uniform sampler2D uRefs;
uniform vec2  uRingPos;
uniform float uRingRadius;
uniform float uRingWidth;
uniform float uRingWidth2;
uniform float uPush;
uniform float uTurb;
uniform float uTime;
varying vec2 vUV;
${NOISE}
${FIELD_TERMS}
void main(){
    vec4 frame = texture2D(uState, vUV);
    vec2 ref   = texture2D(uRefs, vUV).xy;
    float scale  = frame.z;
    float energy = frame.w;
    float time   = uTime * 0.5;
    vec2 disp; float t; float t2;
    fieldTerms(ref, uRingPos, time, uRingRadius, uRingWidth, uRingWidth2, uTurb, disp, t, t2);
    vec2 mem = frame.xy * 0.8;
    mem -= (uRingPos - (ref + disp)) * pow(max(t2, 0.0), 0.75) * uPush;
    scale += (t - scale) * 0.2;
    vec2 finalPos = ref + disp + (mem * 0.25);
    energy = energy * 0.5 + scale * 0.25;
    gl_FragColor = vec4(finalPos, scale, energy);
}
`;
  const RENDER_VERT = estatico => `
precision highp float;
attribute vec2 aUV;
attribute vec2 aRef;
uniform sampler2D uState;
uniform float uProjF;
uniform float uAspect;
uniform float uCamDist;
uniform float uPointScale;
${estatico ? 'uniform vec2 uRingPos;\nuniform float uRingRadius;\nuniform float uRingWidth;\nuniform float uRingWidth2;\nuniform float uTurb;\nuniform float uTime;' : ''}
varying vec2  vLocalPos;
varying float vScale;
varying float vEnergy;
${estatico ? NOISE : ''}
${estatico ? FIELD_TERMS : ''}
void main(){
${estatico
    ? '    vec2 disp; float t; float t2;\n    fieldTerms(aRef, uRingPos, uTime * 0.5, uRingRadius, uRingWidth, uRingWidth2, uTurb, disp, t, t2);\n    vec4 state = vec4(aRef + disp, t, t * 0.5);'
    : '    vec4 state = texture2D(uState, aUV);'}
    vLocalPos = state.xy;
    vScale    = state.z;
    vEnergy   = state.w;
    vec2 world = state.xy * ${WORLD.toFixed(1)};
    gl_Position = vec4(world.x * uProjF / uAspect, world.y * uProjF, 0.0, uCamDist);
    gl_PointSize = max(vScale, 0.0) * 7.0 * uPointScale;
}
`;
  const RENDER_FRAG = `
precision highp float;
varying vec2  vLocalPos;
varying float vScale;
varying float vEnergy;
uniform vec3  uColors[${MAX_COLORS}];
uniform int   uColorCount;
uniform vec2  uRingPos;
uniform float uTime;
${NOISE}
float sdRoundBox(in vec2 p, in vec2 b, in float r){
    vec2 q = abs(p) - b + r;
    return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
}
vec2 rotate(vec2 v, float a){ float s = sin(a); float c = cos(a); return mat2(c, s, -s, c) * v; }
void main(){
    float noiseAngle = snoise(vec3(vLocalPos * 10.0 + vec2(18.4924, 72.9744), uTime * 0.85));
    float noiseColor = snoise(vec3(vLocalPos * 2.0  + vec2(74.664,  91.556),  uTime * 0.5));
    noiseColor = (noiseColor + 1.0) * 0.5;
    float angle = atan(vLocalPos.y - uRingPos.y, vLocalPos.x - uRingPos.x);
    vec2 uv = gl_PointCoord.xy - vec2(0.5);
    uv.y *= -1.0;
    uv = rotate(uv, -angle + (noiseAngle * 0.5));
    float p = smoothstep(0.0, 0.75, pow(noiseColor, 2.0));
    vec3 color = uColors[0];
    for (int i = 0; i < ${MAX_COLORS - 1}; i++) {
        if (i < uColorCount - 1) {
            float span = 1.0 / float(uColorCount - 1);
            float t = clamp((p - float(i) * span) / span, 0.0, 1.0);
            color = mix(color, uColors[i + 1], t);
        }
    }
    float d = sdRoundBox(uv, vec2(0.5, 0.2), 0.25);
    float mask = smoothstep(0.1, 0.0, d);
    float a = mask * smoothstep(0.1, 0.2, vScale);
    if (a < 0.01) discard;
    color = clamp(color, 0.0, 1.0);
    color *= clamp(vEnergy, 0.0, 1.0);
    gl_FragColor = vec4(color, clamp(a, 0.0, 1.0));
}
`;

  function compila(gl, tipo, src) {
    const sh = gl.createShader(tipo);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { const log = gl.getShaderInfoLog(sh); gl.deleteShader(sh); throw new Error(log || 'shader'); }
    return sh;
  }
  function programa(gl, vs, fs, nomes) {
    const prog = gl.createProgram(), v = compila(gl, gl.VERTEX_SHADER, vs), f = compila(gl, gl.FRAGMENT_SHADER, fs);
    gl.attachShader(prog, v); gl.attachShader(prog, f); gl.linkProgram(prog); gl.deleteShader(v); gl.deleteShader(f);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { const log = gl.getProgramInfoLog(prog); gl.deleteProgram(prog); throw new Error(log || 'link'); }
    const u = {}; for (const n of nomes) u[n] = gl.getUniformLocation(prog, n);
    return { prog, u };
  }
  function contexto(canvas) {
    const opts = { alpha: true, antialias: false, premultipliedAlpha: false, depth: false, stencil: false, powerPreference: 'high-performance', preserveDrawingBuffer: true };
    let gl = canvas.getContext('webgl2', opts), fmt = null;
    if (gl) fmt = gl.getExtension('EXT_color_buffer_float') ? { internal: gl.RGBA32F, format: gl.RGBA, type: gl.FLOAT } : { internal: gl.RGBA16F, format: gl.RGBA, type: gl.HALF_FLOAT };
    else {
      gl = canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts);
      if (!gl) return null;
      const ok = gl.getExtension('OES_texture_float') && gl.getExtension('WEBGL_color_buffer_float');
      fmt = ok ? { internal: gl.RGBA, format: gl.RGBA, type: gl.FLOAT } : null;
    }
    if (gl.getParameter(gl.MAX_VERTEX_TEXTURE_IMAGE_UNITS) < 2) fmt = null;
    return { gl, fmt };
  }
  function textura(gl, fmt, tam, px) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, fmt.internal, tam, tam, 0, fmt.format, fmt.type, px || null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

    poe(rand() * tam, rand() * tam);
    while (ativos.length > 0 && px.length < MAX_POINTS) {
      const ai = (rand() * ativos.length) | 0, idx = ativos[ai];
      let pos = false;
      for (let t = 0; t < tentativas; t++) {

        const nx = px[idx] + Math.cos(ang) * r, ny = py[idx] + Math.sin(ang) * r;

  const host = document.getElementById('campo'), canvas = document.getElementById('tela');
  const ctx = contexto(canvas);
  if (!ctx) { host.classList.add('sem-gl'); return; }
  const { gl, fmt } = ctx, sim = !!fmt;
  let simProg = null, renderProg = null;
  try {
    if (sim) simProg = programa(gl, SIM_VERT, SIM_FRAG, ['uState', 'uRefs', 'uRingPos', 'uRingRadius', 'uRingWidth', 'uRingWidth2', 'uPush', 'uTurb', 'uTime']);
    const nomes = ['uProjF', 'uAspect', 'uCamDist', 'uPointScale', 'uColors[0]', 'uColorCount', 'uRingPos', 'uTime'];

  const L = { dotSize: PRESET.dotSize / 100, speed: PRESET.speed / 50, camDist: PRESET.cameraDistance / 100, ringRadius: PRESET.ring.radius / 100,
    ringWidth: Math.max(PRESET.ring.width, 1) / 100, ringEdge: RING_EDGE / 100, push: PRESET.ring.push / 100, turb: PRESET.ring.turbulence / 100 };

  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const uvBuf = gl.createBuffer(), refBuf = gl.createBuffer();
  let refsTex = null, rt1 = null, rt2 = null;
  const f = montaCampo(PRESET.density), count = f.count, tam = f.tam;
  gl.bindBuffer(gl.ARRAY_BUFFER, uvBuf); gl.bufferData(gl.ARRAY_BUFFER, f.aUV, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, refBuf); gl.bufferData(gl.ARRAY_BUFFER, f.aRef, gl.STATIC_DRAW);
  if (sim) {
    refsTex = textura(gl, { internal: fmt.internal, format: gl.RGBA, type: gl.FLOAT }, tam, f.refs);
    rt1 = alvo(gl, fmt, tam); rt2 = alvo(gl, fmt, tam);

  // computador, acima dele no celular (senão ficaria escondido atrás do cartão)
  const cartao = document.querySelector('.cartao');
  let rep = { x: 0, y: 0 };
  function repouso() {
    const r = cartao.getBoundingClientRect();
    let x = cssW / 2, y = cssH / 2;
    if (cssW > 760) x = Math.max(r.left, 0) / 2; else y = Math.max(r.top, 0) / 2;
    return { x: (x / cssW) * 2 - 1, y: -((y / cssH) * 2 - 1) };
  }
  const ajusta = () => {
    dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    cssW = Math.max(canvas.clientWidth || 1, 1); cssH = Math.max(canvas.clientHeight || 1, 1);
    const w = Math.max(1, Math.round(cssW * dpr)), h = Math.max(1, Math.round(cssH * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }

    acorda();
  };

  const ponteiro = { x: 0, y: 0, sobre: false }, anel = { x: 0, y: 0, novo: true };
  let segue = 0, ultMov = performance.now();
  window.addEventListener('pointermove', e => {
    if (REDUZ) return;                                       // "reduzir movimento": o anel não segue o mouse
    const r = canvas.getBoundingClientRect();
    ponteiro.x = ((e.clientX - r.left) / Math.max(r.width, 1)) * 2 - 1;
    ponteiro.y = -(((e.clientY - r.top) / Math.max(r.height, 1)) * 2 - 1);

    ultMov = performance.now(); acorda();
  }, { passive: true });
  document.addEventListener('pointerleave', () => { ponteiro.sobre = false; ultMov = performance.now(); acorda(); });

  const posSim = simProg ? gl.getAttribLocation(simProg.prog, 'aPos') : -1;
  const uvLoc = gl.getAttribLocation(renderProg.prog, 'aUV'), refLoc = gl.getAttribLocation(renderProg.prog, 'aRef');
  gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND);
  gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

  let raf = 0, ultimo = 0, simTime = 0, vaga = 0, ping = true;
  function quadro(agora) {
    raf = 0;
    const dt = Math.min(ultimo ? (agora - ultimo) / 1000 : 1 / 60, 1 / 20);
    ultimo = agora;
    simTime = (simTime + dt * L.speed) % 3600;
    vaga += dt * L.speed;

      const src = ping ? rt1 : rt2, dst = ping ? rt2 : rt1;
      gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo); gl.viewport(0, 0, tam, tam); gl.disable(gl.BLEND);

</script>
