<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pauta do mês · B.O.N.E</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Pauta do mês: página só-leitura pra compartilhar por link. Mesmos tokens do painel. */
  :root{
    --page:#0F0F0D; --surface:#1B1B18; --surface-2:#151513;
    --ink:#F4F2E9; --ink-2:#C7C4B6; --ink-3:#8C897C;
    --hair:#33322B; --hair-2:#26251F; --stroke:#000; --sb:#FCC100;
    --ok:#2FD06A; --warn:#FFB020; --crit:#FF4D4D; --pub:#ee5e99;
    --bw:2px; --hard:4px 4px 0 rgba(0,0,0,.85); --hard-s:3px 3px 0 rgba(0,0,0,.85);
  }
  *{box-sizing:border-box; margin:0}
  [hidden]{display:none !important}
  html{color-scheme:dark}
  body{font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--page); color:var(--ink); font-size:14px;
    background-image:radial-gradient(rgba(255,255,255,.028) 1px, transparent 1px); background-size:22px 22px; transition:background-color .45s ease; min-height:100vh}
  button{font:inherit; border:0; background:none; color:inherit; cursor:pointer}
  a{color:inherit}
  .wrap{max-width:900px; margin:0 auto; padding:18px 16px 60px}
  /* topo */
  .top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px}
  .logo{width:30px; height:30px; background:var(--sb); border:var(--bw) solid var(--stroke); border-radius:7px; box-shadow:var(--hard-s);
    display:flex; align-items:center; justify-content:center; color:#000; font-weight:800; font-size:15px; transform:rotate(-4deg); transition:background-color .45s ease}
  .top .bname{display:flex; flex-direction:column; line-height:1.05}
  .top b{font-size:17px; font-weight:700; letter-spacing:-.02em}
  .top .sub{font-size:9px; color:var(--ink-3); font-weight:700; letter-spacing:.12em; text-transform:uppercase; margin-top:2px; white-space:nowrap}
  .top .tag{font-size:10.5px; color:#000; background:var(--sb); font-weight:800; letter-spacing:.1em; text-transform:uppercase; border:2px solid var(--stroke); border-radius:6px; padding:3px 9px; box-shadow:2px 2px 0 #000; transition:background-color .45s ease}
  /* dias sem post: aparecem também, compactos, pra os buracos ficarem visíveis */
  .dia.semposto{padding:5px 0}
  .dia.semposto .dnum b{color:var(--ink-3)}
  .dia.semposto .fds .dnum b{color:var(--ink-3)}
  .semposto-box{border:1.5px dashed var(--hair); border-radius:8px; padding:5px 6px 5px 11px; font-size:11px; font-weight:700; color:var(--ink-3); letter-spacing:.04em; display:flex; align-items:center; gap:8px}
  .semposto-box.gm{border-color:var(--sb); color:var(--sb)}
  .semposto-box .sugerir{margin-left:auto; font-size:10.5px; font-weight:800; letter-spacing:.06em; color:#C77DFF; border:1.5px dashed #C77DFF; border-radius:6px; padding:4px 9px; white-space:nowrap;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .15s, color .15s}
  .semposto-box .sugerir:hover{background:#C77DFF; color:#000; transform:translateY(-1px)}
  .post.sugestao{border-style:dashed; border-color:#C77DFF; background:linear-gradient(90deg, rgba(199,125,255,.10), transparent 60%)}
  .post.sugestao .fmt{font-size:15px; background:rgba(199,125,255,.15); border-color:#C77DFF}
  .post .tit .quem{font-size:11px; color:var(--ink-3); font-weight:600}
  /* capa (primeira arte visível) na lista */
  .post .capa{position:relative; width:64px; height:64px; flex:none; border-radius:7px; overflow:hidden; border:1.5px solid var(--hair); background:#000}
  .post .capa img{width:100%; height:100%; object-fit:cover; display:block}
  .post .capa .capan{position:absolute; right:3px; bottom:3px; background:rgba(0,0,0,.8); color:#fff; font-size:9.5px; font-weight:800; border-radius:4px; padding:1px 5px}
  /* parecer: selo na lista, bloco no modal */
  .pill.parecer.ok{background:var(--ok)} .pill.parecer.alt{background:var(--warn); color:#000}
  .parecer-atual{font-size:13px; font-weight:700; padding:10px 12px; border-radius:8px; border:2px solid var(--hair); background:var(--surface-2); display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .parecer-atual.ok{border-color:var(--ok); color:var(--ok)} .parecer-atual.alt{border-color:var(--warn); color:var(--warn)}
  .parecer-atual .cu{font-size:11px; color:var(--ink-3); font-weight:600}
  .parecer-atual.vazio{color:var(--ink-3); font-weight:600}
  .parecer-atual .mudar{margin-left:auto; font-size:11px; font-weight:800; color:var(--ink-3); border:1.5px dashed var(--hair); border-radius:6px; padding:3px 9px}
  .parecer-atual .mudar:hover{color:var(--ink); border-color:var(--ink-3)}
  .prbtns{gap:8px}
  .prbtn{flex:1; font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:11px; border-radius:8px; border:2px solid var(--hair); background:var(--surface-2); color:var(--ink-2);
    transition:transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .15s, background .15s, color .15s, border-color .15s}
  .prbtn:hover{transform:translateY(-2px)}
  .prbtn.ok.on{background:var(--ok); color:#000; border-color:var(--stroke); box-shadow:3px 3px 0 #000}
  .prbtn.alt.on{background:var(--warn); color:#000; border-color:var(--stroke); box-shadow:3px 3px 0 #000}
  /* visualizador de artes dentro do card: imagem grande, setas, contador, tira de miniaturas */
  #martesG.artes{display:block}
  .viewer{position:relative; background:#000; border:2px solid var(--stroke); border-radius:10px; overflow:hidden; box-shadow:var(--hard-s)}
  .vimg{display:block; width:100%; max-height:72vh; object-fit:contain; background:#000; cursor:zoom-in; min-height:220px}
  .vnav{position:absolute; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%; background:rgba(0,0,0,.7); color:#fff; border:2px solid var(--stroke);
    font-size:26px; line-height:1; display:flex; align-items:center; justify-content:center; box-shadow:var(--hard-s); transition:background .15s, transform .15s}
  .vnav:hover{background:var(--sb); color:#000; transform:translateY(-50%) scale(1.08)}
  .vnav.prev{left:10px} .vnav.next{right:10px}
  .vcount{position:absolute; top:10px; left:10px; background:var(--sb); color:#000; font-size:11px; font-weight:800; border:1.5px solid var(--stroke); border-radius:5px; padding:2px 8px}
  .vcount:empty{display:none}
  .vnome{position:absolute; bottom:0; left:0; right:0; padding:6px 10px; font-size:10.5px; font-weight:700; color:#fff; background:linear-gradient(transparent, rgba(0,0,0,.75)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none}
  .vstrip{display:flex; gap:6px; margin-top:8px; overflow-x:auto; padding-bottom:4px}
  .vth{flex:none; width:64px; height:64px; border-radius:7px; overflow:hidden; border:2px solid var(--hair); background:#000; padding:0; opacity:.6; transition:opacity .15s, border-color .15s, transform .15s}
  .vth img{width:100%; height:100%; object-fit:cover; display:block}
  .vth:hover{opacity:1} .vth.on{opacity:1; border-color:var(--sb); transform:translateY(-2px)}
  .outros{display:flex; flex-direction:column; gap:6px; margin-top:8px}
  /* tela cheia */
  .lb{position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.94); display:none; align-items:center; justify-content:center}
  .lb.open{display:flex; animation:ovin .12s ease both}
  .lb img{max-width:96vw; max-height:90vh; object-fit:contain; border:2px solid var(--stroke); box-shadow:var(--hard)}
  .lbx{position:fixed; top:14px; right:14px; width:40px; height:40px; border-radius:50%; background:var(--surface); color:var(--ink); border:2px solid var(--stroke); font-size:18px; font-weight:800; box-shadow:var(--hard-s)}
  .lbx:hover{background:var(--sb); color:#000}
  .lbnav{position:fixed; top:50%; transform:translateY(-50%); width:48px; height:48px; border-radius:50%; background:var(--surface); color:var(--ink); border:2px solid var(--stroke); font-size:30px; line-height:1; box-shadow:var(--hard-s)}
  .lbnav:hover{background:var(--sb); color:#000}
  .lbnav.prev{left:14px} .lbnav.next{right:14px}
  .lbcap{position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--surface); color:var(--ink-2); font-size:12px; font-weight:700; border:2px solid var(--stroke); border-radius:999px; padding:6px 14px; box-shadow:var(--hard-s); max-width:80vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  @media (max-width:560px){ .vimg{max-height:60vh} .vnav{width:34px; height:34px; font-size:22px} }
  .obsform .sel{font:inherit; font-size:13px; color:var(--ink); background:var(--surface-2); border:2px solid var(--hair); border-radius:8px; padding:9px 12px; flex:1; min-width:140px}
  .nota{font-size:11.5px; color:var(--ink-3); line-height:1.5}
  .dia.fds .dnum span{color:var(--ink-3); opacity:.8}
  .top .ro{margin-left:auto; font-size:10.5px; color:var(--ink-3); font-weight:700; letter-spacing:.08em; text-transform:uppercase; border:1.5px dashed var(--hair); border-radius:6px; padding:4px 9px}
  /* abas */
  .tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
  .tab{padding:8px 16px; border-radius:6px; border:var(--bw) solid var(--hair); font-weight:700; font-size:13px; color:var(--ink-2);
    transition:transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .18s, border-color .18s}
  .tab:hover{border-color:var(--ink-3); transform:translateY(-2px) scale(1.04)}
  .tab.on{color:#000; border-color:var(--stroke); box-shadow:var(--hard-s); transform:translateY(-1px) scale(1.03)}
  .tab.fixo{cursor:default} .tab.fixo:hover{transform:translateY(-1px) scale(1.03)}
  /* mês + resumo */
  .mes{display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap}
  .mnav{display:flex; align-items:center; gap:4px; background:var(--surface); border:var(--bw) solid var(--hair); border-radius:6px; padding:3px 5px}
  .mnav button{padding:5px 10px; border-radius:5px; font-weight:800; color:var(--ink-2)}
  .mnav button:hover{background:var(--hair-2); color:var(--ink)}
  .mnav .lbl{min-width:150px; text-align:center; font-weight:800; font-size:14px; text-transform:capitalize}
  .filtro{margin-left:auto; display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:var(--ink-2); border:1.5px solid var(--hair); border-radius:6px; padding:5px 11px; background:var(--surface); cursor:pointer; transition:border-color .15s}
  .filtro.on{border-color:var(--pub); color:var(--pub)}
  .resumo{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; margin-bottom:18px}
  .kpi{background:var(--surface); border:var(--bw) solid var(--hair); border-radius:8px; padding:10px 12px}
  .kpi b{display:block; font-size:22px; font-weight:800; letter-spacing:-.02em; line-height:1}
  .kpi span{font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
  .kpi.pronto{border-color:var(--pub)} .kpi.pronto b{color:var(--pub)}
  /* semanas e dias */
  .sem{margin-bottom:18px}
  .semtit{display:flex; align-items:baseline; gap:10px; padding:0 0 8px; border-bottom:var(--bw) solid var(--stroke); margin-bottom:10px}
  .semtit b{font-size:13px; font-weight:800; letter-spacing:.08em; color:var(--sb); text-transform:uppercase; transition:color .45s ease}
  .semtit span{font-size:11px; color:var(--ink-3); font-weight:700}
  .dia{display:grid; grid-template-columns:64px 1fr; gap:10px; padding:8px 0; border-bottom:1.5px solid var(--hair-2)}
  .dia:last-child{border-bottom:0}
  .dnum{text-align:center; padding-top:3px}
  .dnum b{display:block; font-size:20px; font-weight:800; line-height:1}
  .dnum span{font-size:9.5px; font-weight:800; letter-spacing:.12em; color:var(--ink-3)}
  .dia.hoje .dnum b{background:var(--sb); color:#000; border-radius:6px; display:inline-block; padding:1px 7px}
  .dia.gmpede .dnum span::after{content:" ☆"; color:var(--sb)}
  .posts{display:flex; flex-direction:column; gap:7px}
  .post{display:flex; align-items:flex-start; gap:10px; background:var(--surface); border:1.5px solid var(--hair); border-left:5px solid var(--cc,#8C897C); border-radius:8px; padding:9px 11px; cursor:pointer; text-align:left; width:100%;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .15s, border-color .15s}
  .post:hover{transform:translate(-1px,-2px); box-shadow:var(--hard-s); border-color:var(--ink-3); border-left-color:var(--cc,#8C897C)}
  .post.pronto{background:linear-gradient(90deg, rgba(238,94,153,.09), transparent 55%)}
  .post.vaga{border-style:dashed; opacity:.75}
  .post .fmt{width:28px; height:28px; border-radius:6px; background:var(--hair-2); border:1.5px solid var(--hair); display:flex; align-items:center; justify-content:center; flex:none; color:var(--ink-2)}
  svg.i{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .post .body{min-width:0; flex:1}
  .post .tit{font-size:13.5px; font-weight:700; line-height:1.35; color:var(--ink)}
  .post .tit .gm{color:var(--sb); margin-left:4px}
  .post .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; align-items:center}
  .pill{font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:2px 8px; border-radius:5px; color:#000}
  .chip{font-size:10.5px; font-weight:700; color:var(--ink-2); border:1.5px solid var(--hair); border-radius:5px; padding:1px 7px}
  .chip.conta{border-color:var(--cc); color:var(--cc)}
  .chip.obs{border-color:var(--warn); color:var(--warn)}
  .post .abrir{flex:none; align-self:center; color:var(--ink-3); font-size:11px; font-weight:800; letter-spacing:.06em}
  .vazio{text-align:center; color:var(--ink-3); padding:40px 10px; font-weight:600}
  .rodape{margin-top:26px; font-size:11px; color:var(--ink-3); text-align:center; line-height:1.6}
  .erro{background:var(--crit); color:#fff; border:var(--bw) solid var(--stroke); border-radius:8px; padding:14px; font-weight:700; text-align:center; margin-top:30px}
  /* ---- detalhe do post (modal) ---- */
  .ov{position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:60; display:none; align-items:flex-start; justify-content:center; overflow:auto; padding:5vh 14px}
  .ov.open{display:flex; animation:ovin .14s ease both}
  @keyframes ovin{from{opacity:0} to{opacity:1}}
  .modal{background:var(--surface); border:var(--bw) solid var(--stroke); border-radius:12px; width:min(720px,100%); box-shadow:var(--hard); position:relative; animation:popin .2s cubic-bezier(.2,.8,.3,1) both}
  @keyframes popin{from{opacity:0; transform:translateY(10px) scale(.985)} to{opacity:1; transform:none}}
  .mhead{padding:18px 20px 12px; border-bottom:var(--bw) solid var(--hair); border-left:6px solid var(--cc,#8C897C); border-radius:12px 0 0 0}
  .mhead .mtit{font-size:17px; font-weight:800; letter-spacing:-.01em; line-height:1.3; padding-right:36px}
  .mhead .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; align-items:center}
  .mclose{position:absolute; top:12px; right:12px; color:var(--ink-3); padding:6px 9px; border-radius:6px; transition:all .15s}
  .mclose:hover{background:var(--hair-2); color:var(--ink)}
  .mbody{padding:14px 20px 20px; display:flex; flex-direction:column; gap:16px}
  .sec .stit{font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin-bottom:7px; display:flex; align-items:center; gap:8px}
  .sec .stit .n{background:var(--hair-2); border-radius:5px; padding:0 6px; font-size:10px}
  .desc{line-height:1.7; font-size:14px; color:var(--ink-2); background:var(--surface-2); border:1.5px solid var(--hair); border-radius:8px; padding:14px 16px; max-height:420px; overflow:auto}
  .desc b{color:var(--ink)}
  .desc p{margin:0 0 11px} .desc p:last-child{margin-bottom:0}
  .desc p.h{font-weight:800; color:var(--ink); font-size:13px; letter-spacing:.06em; text-transform:uppercase; margin:16px 0 8px; padding-top:10px; border-top:1.5px solid var(--hair-2)}
  .desc p.h:first-child{margin-top:0; padding-top:0; border-top:0}
  .desc .rot{color:var(--sb); font-weight:800}
  .desc ul,.desc ol{margin:0 0 12px 20px; padding:0} .desc li{margin:0 0 6px; padding-left:2px}
  .desc code{font-family:inherit; background:var(--hair-2); border-radius:4px; padding:0 5px}
  .meta{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px}
  .meta div{background:var(--surface-2); border:1.5px solid var(--hair); border-radius:8px; padding:8px 11px}
  .meta span{display:block; font-size:9.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin-bottom:3px}
  .meta b{font-size:13px; font-weight:700}
  .artes{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px}
  .arte{display:block; border:1.5px solid var(--hair); border-radius:8px; overflow:hidden; background:var(--surface-2); text-decoration:none; transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .15s, border-color .15s}
  .arte:hover{transform:translate(-1px,-2px); box-shadow:var(--hard-s); border-color:var(--ink-3)}
  .arte img{display:block; width:100%; aspect-ratio:1; object-fit:cover; background:#000}
  .arte .an{font-size:10px; color:var(--ink-3); padding:5px 7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700}
  .arte.file{display:flex; align-items:center; gap:8px; padding:10px; aspect-ratio:auto}
  .arte.file .ext{font-size:10px; font-weight:800; background:var(--hair-2); border-radius:5px; padding:2px 6px; text-transform:uppercase}
  .carreg{color:var(--ink-3); font-size:12px; font-weight:600}
  /* observações */
  .notas{white-space:pre-wrap; line-height:1.6; font-size:13px; color:var(--ink-2); background:var(--surface-2); border:1.5px solid var(--hair); border-radius:8px; padding:11px 13px}
  .notas:empty{display:none}
  .obsform{display:grid; gap:8px; margin-top:8px}
  .obsform textarea{width:100%; min-height:84px; resize:vertical; font:inherit; font-size:13.5px; line-height:1.5; color:var(--ink); background:var(--surface-2); border:2px solid var(--hair); border-radius:8px; padding:10px 12px; transition:border-color .15s, box-shadow .15s}
  .obsform textarea:focus,.obsform input:focus{outline:none; border-color:var(--sb); box-shadow:3px 3px 0 #000}
  .obsrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .obsform input{flex:1; min-width:140px; font:inherit; font-size:13px; color:var(--ink); background:var(--surface-2); border:2px solid var(--hair); border-radius:8px; padding:9px 12px; transition:border-color .15s, box-shadow .15s}
  .obsenviar{background:var(--sb); color:#000; border:2px solid var(--stroke); border-radius:8px; padding:9px 16px; font-weight:800; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    transition:transform .3s cubic-bezier(.23,1,.32,1), box-shadow .3s cubic-bezier(.23,1,.32,1), background-color .45s ease}
  .obsenviar:hover{transform:translate(-3px,-3px); box-shadow:4px 4px 0 #000}
  .obsenviar:active{transform:none; box-shadow:none}
  .obsenviar[disabled]{opacity:.5; cursor:wait; transform:none; box-shadow:none}
  .obsmsg{font-size:11.5px; color:var(--ink-3); font-weight:600; min-height:1em}
  .obsmsg.ok{color:var(--ok)} .obsmsg.err{color:var(--crit)}
  .mfoot{padding:0 20px 16px; display:flex; justify-content:flex-end}
  .mfoot a{font-size:11px; color:var(--ink-3); font-weight:700; text-decoration:none; display:flex; align-items:center; gap:5px; padding:6px 8px; border-radius:6px; transition:all .15s}
  .mfoot a:hover{color:var(--ink); background:var(--hair-2)}
  @media (max-width:560px){ .dia{grid-template-columns:48px 1fr} .dnum b{font-size:17px} .top .ro{display:none} .filtro{margin-left:0} .post .abrir{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">SB</div>
    <div class="bname"><b>B.O.N.E</b><span class="sub">Bora Organizar Nossas Entregas</span></div>
    <span class="tag">pauta do mês</span>
    <span class="ro">só leitura · ao vivo</span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="mes">
    <div class="mnav">
      <button id="mPrev" title="mês anterior">‹</button>
      <div class="lbl" id="mesLbl">…</div>
      <button id="mNext" title="próximo mês">›</button>
    </div>
    <button class="filtro" id="soProntos" title="mostrar só o que está pronto pra publicar ou já postado">● só prontos</button>
  </div>
  <div class="resumo" id="resumo"></div>
  <div id="lista"><div class="vazio">carregando…</div></div>
  <div class="rodape" id="rodape"></div>
</div>

<div class="ov" id="ovPost">
  <div class="modal" id="modal">
    <div class="mhead" id="mhead"></div>
    <button class="mclose" id="mclose" title="fechar (Esc)">✕</button>
    <div class="mbody" id="mbody"></div>

<div class="lb" id="lb">

  <button type="button" class="lbnav next" id="lbnext" title="próxima (→)">›</button>
  <div class="lbcap" id="lbcap"></div>

<script>
const TEMAS = { 'SEUBONÉ':{sb:'#FCC100',page:'#0F0F0D'}, 'CARBONE':{sb:'#F2F2EC',page:'#101010'}, 'ONEVO':{sb:'#0AFFA3',page:'#081815'}, 'WEEVO':{sb:'#177D81',page:'#0C1414'} };
const CONTA_CORES = { 'seubone':'#FCC100','carbone-edu':'#F2F2EC','carbone-club':'#8A8A82','onevo-energia':'#0AFFA3','onevo-invest':'#FFC721','weevo':'#177D81' };
const CONTA_CURTA = { 'seubone':'SEUBONÉ','carbone-edu':'EDUCAÇÃO','carbone-club':'CLUB','onevo-energia':'ENERGIA','onevo-invest':'INVESTIMENTOS','weevo':'WEEVO' };
const ICO = {
  reels:'<svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M8.2 5v14M15.8 5v14M3.5 9.7h4.7M3.5 14.3h4.7M15.8 9.7h4.7M15.8 14.3h4.7"/></svg>',
  carrossel:'<svg class="i" viewBox="0 0 24 24"><rect x="7.5" y="7.5" width="12.5" height="12.5" rx="2"/><path d="M4 16.5V5.5A1.5 1.5 0 0 1 5.5 4h11"/></svg>',
  'estático':'<svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4.5 17l4.5-4.5 3.5 3.5 2.5-2.5 4.5 4.5"/></svg>',
  story:'<svg class="i" viewBox="0 0 24 24"><path d="M13 2L5 13.5h6L11 22l8-11.5h-6L13 2z"/></svg>',
  post:'<svg class="i" viewBox="0 0 24 24"><path d="M8 6.5h11M8 12h11M8 17.5h11"/><circle cx="4" cy="6.5" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="17.5" r="1"/></svg>',
  link:'<svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M9 5H6.5A2.5 2.5 0 0 0 4 7.5v10A2.5 2.5 0 0 0 6.5 20h10a2.5 2.5 0 0 0 2.5-2.5V15"/></svg>',
};
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DOWS = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const Q = new URLSearchParams(location.search);
const token = Q.get('token')||'';
const ESCOPO = Q.get('aba')||null;         // link de UMA empresa: trava a aba
const ST = { aba:null, mes:null, dados:null, soProntos:false, aberto:null };
function qs(extra){ return 'token='+encodeURIComponent(token)+(ESCOPO?'&aba='+encodeURIComponent(ESCOPO):'')+(extra||''); }
function img(u){ return '/api/img?u='+encodeURIComponent(u)+'&pt='+encodeURIComponent(token); }
function hojeStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function lerHash(){ const h=decodeURIComponent(location.hash.slice(1)); const [aba,mes]=h.split('/'); return {aba:aba||null, mes:/^\d{4}-\d{2}$/.test(mes||'')?mes:null}; }
function gravarHash(){ try{ history.replaceState(null,'','#'+encodeURIComponent(ST.aba)+'/'+ST.mes); }catch(e){} }
function aplicarTema(aba){ const t=TEMAS[aba]||TEMAS['SEUBONÉ']; document.documentElement.style.setProperty('--sb',t.sb); document.documentElement.style.setProperty('--page',t.page); }
// ---- GM (mesma regra do painel: âncora rolante a partir da última grande marca confirmada) ----
function gmCadenciaDia(d){
  const gc=ST.dados.gmCadencia, anc=ST.dados.gmAncoras||[];
  if(!gc||!gc.ativo||!d) return false;
  let a=null; for(let i=anc.length-1;i>=0;i--){ if(anc[i]<=d){ a=anc[i]; break; } }
  if(!a) return false;
  const dias=Math.round((Date.parse(d+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/86400000);
  return dias%(gc.periodo||3)===0;
}
function isGm(s){ if(s.conta!=='seubone') return s.gm==='sim'; if(s.gm==='sim') return true; if(s.gm==='nao') return false; return gmCadenciaDia(s.date); }
// ---- status (igual ao painel: completo = publicar) ----
function ehPublicar(s){ const st=(s.statusCache&&s.statusCache.status)||''; return st==='publicar'||st==='completo'; }
function ehSugestao(s){ return !!s.sugestao && !s.taskId; }
function stInfo(s){
  if(s.vaga && !s.taskId) return {label:'falta criar', color:'#FF4D4D'};
  if(ehSugestao(s)) return {label:'sugestão', color:'#C77DFF'};
  if(s.postado) return {label:'postado', color:'#2FD06A'};
  if(s.statusCache){ if(ehPublicar(s)) return {label:'publicar', color:'#ee5e99'}; return {label:s.statusCache.status, color:s.statusCache.color||'#8C897C'}; }
  if(s.taskId) return {label:'sincronizando', color:'#8C897C'};
  return {label:'sem task', color:'#8C897C'};
}
function ehPronto(s){ return !!s.postado || ehPublicar(s); }
function titulo(s){
  if(s.vaga && !s.taskId) return 'FALTA CRIAR: '+((s.formato||'post').toUpperCase());
  if(ehSugestao(s)) return String(s.titulo||'Sugestão').replace(/^SUGESTÃO:\s*/i,'');
  if(s.titulo) return s.titulo;
  if(s.origem==='banco') return s.taskId ? (s.obs||'Task do ClickUp') : ('Reutilizar: '+(s.obs||'vídeo'));
  const c=ST.dados.contas[s.conta];
  return (s.formato? s.formato.charAt(0).toUpperCase()+s.formato.slice(1) : 'Post')+' · '+(c?c.nome:'');
}
function contasDaAba(aba){ return Object.entries(ST.dados.contas).filter(([,c])=>c.aba===aba).map(([k])=>k); }
function corConta(k){ return CONTA_CORES[k]||(ST.dados.contas[k]&&ST.dados.contas[k].cor)||'#8C897C'; }
function nomeConta(k){ return (ST.dados.contas[k]&&ST.dados.contas[k].nome)||k; }
function addMes(mes,n){ const [y,m]=mes.split('-').map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function dow(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(Date.UTC(y,m-1,d,12)).getUTCDay(); }
function segundaDe(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(Date.UTC(y,m-1,d,12)); const off=(dt.getUTCDay()+6)%7; dt.setUTCDate(dt.getUTCDate()-off); return dt.toISOString().slice(0,10); }
function brDia(iso){ return iso.slice(8,10)+'/'+iso.slice(5,7); }
function brData(iso){ return iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4); }
/** Descrição do ClickUp em blocos legíveis: parágrafos com respiro, títulos destacados, listas de verdade, negrito. */
function mdLeve(t){
  const inl = x => esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const lines = String(t||'').replace(/\r/g,'').replace(/\\n/g,'\n').split('\n');
  let html='', lista=null;
  const fecha = ()=>{ if(lista){ html+='</'+lista+'>'; lista=null; } };
  for(const raw of lines){
    const l = raw.trim();
    if(!l){ fecha(); continue; }
    const hm = l.match(/^#{1,6}\s+(.+)$/);
    if(hm){ fecha(); html+='<p class="h">'+inl(hm[1])+'</p>'; continue; }
    const ul = l.match(/^(?:[-*•]|\[[ x]\])\s+(.+)$/i), ol = l.match(/^\d+[.)]\s+(.+)$/);
    if(ul||ol){ const tipo = ol?'ol':'ul'; if(lista!==tipo){ fecha(); html+='<'+tipo+'>'; lista=tipo; } html+='<li>'+inl((ul||ol)[1])+'</li>'; continue; }
    fecha();
    // rótulo no começo da linha ("Legenda:", "Roteiro:") ganha destaque
    const rot = l.match(/^([A-Za-zÀ-ú0-9 ]{2,24}):\s+(.+)$/);
    html += rot ? '<p><b class="rot">'+esc(rot[1])+':</b> '+inl(rot[2])+'</p>' : '<p>'+inl(l)+'</p>';
  }
  fecha();
  return html || '<span class="carreg">sem descrição na task</span>';
}

async function carregar(){
  try{
    const r=await fetch('/api/pauta?'+qs('&mes='+ST.mes),{cache:'no-store'});
    if(r.status===401){ $('#lista').innerHTML='<div class="erro">Este link não é válido. Peça um link novo pra quem cuida do painel.</div>'; $('#resumo').innerHTML=''; return; }
    ST.dados=await r.json();
    if(!ST.aba || !ST.dados.abas.includes(ST.aba)) ST.aba=ST.dados.abas[0];
    render();
    if(ST.aberto){ const s=ST.dados.slots.find(x=>x.id===ST.aberto); if(s) atualizaNotas(s); }
  }catch(e){ $('#lista').innerHTML='<div class="erro">Não consegui carregar a pauta agora. Tenta de novo em instantes.</div>'; }
}
function render(){
  const D=ST.dados; aplicarTema(ST.aba); gravarHash();
  document.title='Pauta '+ST.aba+' · '+MESES[+ST.mes.slice(5)-1]+' · B.O.N.E';
  const tabs=$('#tabs'); tabs.innerHTML='';
  D.abas.forEach(aba=>{ const b=document.createElement('button'); b.className='tab'+(aba===ST.aba?' on':'')+(D.abas.length===1?' fixo':''); b.textContent=aba; if(aba===ST.aba) b.style.background=(TEMAS[aba]||{}).sb||'#888'; if(D.abas.length>1) b.onclick=()=>{ ST.aba=aba; render(); }; tabs.appendChild(b); });
  const [y,m]=ST.mes.split('-').map(Number);
  $('#mesLbl').textContent=MESES[m-1]+' '+y;
  const contas=contasDaAba(ST.aba), multi=contas.length>1, hoje=hojeStr();
  let posts=D.slots.filter(s=>contas.includes(s.conta)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const tot=posts.length, prontos=posts.filter(ehPronto).length, aprovar=posts.filter(s=>(s.statusCache&&s.statusCache.status)==='aprovar').length,
        producao=posts.filter(s=>{const st=(s.statusCache&&s.statusCache.status)||''; return st&&!ehPronto(s)&&st!=='aprovar';}).length,
        semtask=posts.filter(s=>!s.taskId&&!s.vaga).length, vagas=posts.filter(s=>s.vaga&&!s.taskId).length;
  // todos os dias do mês (os sem post também aparecem, pra os buracos ficarem visíveis)
  const ultimo=new Date(y,m,0).getDate();
  const diasMes=[]; for(let d=1; d<=ultimo; d++) diasMes.push(ST.mes+'-'+String(d).padStart(2,'0'));
  const porDiaTodos={}; posts.forEach(s=>{ (porDiaTodos[s.date]=porDiaTodos[s.date]||[]).push(s); });
  const diasSem=diasMes.filter(d=>!porDiaTodos[d]).length;
  $('#resumo').innerHTML=
    '<div class="kpi"><b>'+tot+'</b><span>posts no mês</span></div>'+
    '<div class="kpi pronto"><b>'+prontos+'</b><span>prontos / postados</span></div>'+
    '<div class="kpi"><b>'+producao+'</b><span>em produção</span></div>'+
    '<div class="kpi"><b>'+aprovar+'</b><span>pra aprovar</span></div>'+
    (diasSem?'<div class="kpi"><b style="color:var(--warn)">'+diasSem+'</b><span>dias sem post</span></div>':'')+
    (semtask?'<div class="kpi"><b>'+semtask+'</b><span>sem task</span></div>':'')+
    (vagas?'<div class="kpi"><b style="color:var(--crit)">'+vagas+'</b><span>falta criar</span></div>':'');
  $('#soProntos').classList.toggle('on', ST.soProntos);
  if(ST.soProntos) posts=posts.filter(ehPronto);
  const porDia={}; posts.forEach(s=>{ (porDia[s.date]=porDia[s.date]||[]).push(s); });
  const lista=$('#lista'); lista.innerHTML='';
  if(ST.soProntos && !posts.length){ lista.innerHTML='<div class="vazio">Nada pronto ainda neste mês.</div>'; }
  else{
    // no filtro "só prontos" mostra só os dias que têm algo pronto; no normal, o mês inteiro
    const diasVisiveis = ST.soProntos ? diasMes.filter(d=>porDia[d]) : diasMes;
    const porSem=new Map();
    diasVisiveis.forEach(d=>{ const k=segundaDe(d); if(!porSem.has(k)) porSem.set(k,[]); porSem.get(k).push(d); });
    let n=0;
    for(const [seg,dias] of porSem){
      n++;
      const fim=(()=>{ const d=new Date(seg+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+6); return d.toISOString().slice(0,10); })();
      const sec=document.createElement('section'); sec.className='sem';
      sec.innerHTML='<div class="semtit"><b>semana '+n+'</b><span>'+brDia(seg)+' a '+brDia(fim)+'</span></div>';
      for(const dia of dias){
        const arr=porDia[dia]||[];
        const fds=[0,6].includes(dow(dia));
        const gmPede = ST.aba==='SEUBONÉ' && gmCadenciaDia(dia) && !arr.some(isGm);
        const row=document.createElement('div'); row.className='dia'+(dia===hoje?' hoje':'')+(gmPede?' gmpede':'')+(arr.length?'':' semposto')+(fds?' fds':'');
        row.innerHTML='<div class="dnum"><b>'+dia.slice(8,10)+'</b><span>'+DOWS[dow(dia)]+'</span></div><div class="posts"></div>';
        const box=row.querySelector('.posts');
        if(!arr.length){
          box.innerHTML='<div class="semposto-box'+(gmPede?' gm':'')+'"><span>'+(gmPede?'☆ sem post · este dia pede grande marca':'sem post planejado')+'</span><button type="button" class="sugerir" title="mandar uma ideia de post pra este dia">+ sugerir post</button></div>';
          box.querySelector('.sugerir').onclick=()=>abrirSugestao(dia);
          sec.appendChild(row); continue;
        }
        arr.forEach(s=>{
          const st=stInfo(s), cc=corConta(s.conta), pronto=ehPronto(s), sug=ehSugestao(s);
          const b=document.createElement('button'); b.className='post'+(pronto?' pronto':'')+((s.vaga&&!s.taskId)?' vaga':'')+(sug?' sugestao':''); b.style.setProperty('--cc',cc); b.title='abrir detalhes';
          const pr = s.parecer && s.parecer.veredito ? s.parecer : null;
          b.innerHTML=(s.capa
              ? '<div class="capa"><img loading="lazy" src="'+esc(img(s.capa))+'" alt="">'+(s.nArtes>1?'<span class="capan">'+s.nArtes+'</span>':'')+'</div>'
              : '<div class="fmt">'+(sug?'💡':(ICO[s.formato]||ICO.post))+'</div>')+
            '<div class="body"><div class="tit">'+esc(titulo(s))+(isGm(s)?'<span class="gm" title="grande marca na capa">★</span>':'')+(sug&&s.sugeridoPor?' <span class="quem">por '+esc(s.sugeridoPor)+'</span>':'')+'</div>'+
            '<div class="chips">'+(pr?'<span class="pill parecer '+(pr.veredito==='aprovado'?'ok':'alt')+'" title="'+esc(pr.motivo||'')+'">'+(pr.veredito==='aprovado'?'✓ aprovado':'✎ alterar')+(pr.por?' · '+esc(pr.por):'')+'</span>':'')+
            '<span class="pill" style="background:'+esc(st.color)+'">'+esc(st.label)+'</span>'+
            (multi?'<span class="chip conta">'+esc(CONTA_CURTA[s.conta]||s.conta)+'</span>':'')+
            (s.formato?'<span class="chip">'+esc(s.formato)+'</span>':'')+(s.angulo?'<span class="chip">'+esc(s.angulo)+'</span>':'')+
            (s.notas?'<span class="chip obs" title="tem observação">obs</span>':'')+'</div></div>'+
            '<span class="abrir">ABRIR ›</span>';
          b.onclick=()=>abrirPost(s.id);
          box.appendChild(b);
        });
        sec.appendChild(row);
      }
      lista.appendChild(sec);
    }
  }
  const t=new Date(D.geradoEm);
  $('#rodape').innerHTML='Página só de leitura, atualiza sozinha a cada minuto · gerada '+t.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'<br>★ = grande marca na capa · ☆ no dia = dia pede grande marca e ainda não tem · clique num post pra ver detalhes e deixar observação';
}

// ---- detalhe do post ----
function abrirPost(id){
  const s=ST.dados.slots.find(x=>x.id===id); if(!s) return;
  ST.aberto=id;
  const st=stInfo(s), cc=corConta(s.conta), contas=contasDaAba(ST.aba);
  $('#modal').style.setProperty('--cc',cc);
  $('#mhead').innerHTML='<div class="mtit">'+esc(titulo(s))+(isGm(s)?' <span style="color:var(--sb)" title="grande marca na capa">★</span>':'')+'</div>'+
    '<div class="chips"><span class="pill" style="background:'+esc(st.color)+'">'+esc(st.label)+'</span>'+
    '<span class="chip conta">'+esc(nomeConta(s.conta))+'</span>'+
    (s.formato?'<span class="chip">'+esc(s.formato)+'</span>':'')+(s.angulo?'<span class="chip">ângulo: '+esc(s.angulo)+'</span>':'')+'</div>';
  const pr = s.parecer && s.parecer.veredito ? s.parecer : null;
  $('#mbody').innerHTML=
    '<div class="sec" id="martes"'+(s.taskId?'':' hidden')+'><div class="stit">artes <span class="n" id="martesN"></span></div><div class="artes" id="martesG"><span class="carreg">…</span></div></div>'+
    '<div class="meta"><div><span>dia do post</span><b>'+brData(s.date)+' · '+DOWS[dow(s.date)]+'</b></div>'+
      (isGm(s)?'<div><span>capa</span><b style="color:var(--sb)">★ grande marca</b></div>':'')+
      '<div id="mresp"><span>responsável</span><b class="carreg">…</b></div><div id="mdue"><span>entrega</span><b class="carreg">…</b></div></div>'+
    '<div class="sec"><div class="stit">descrição</div><div class="desc" id="mdesc"><span class="carreg">'+(s.taskId?'lendo a task…':'este post ainda não tem task no ClickUp')+'</span></div></div>'+
    // parecer: aprova (-> PUBLICAR) ou pede alteração (-> ALTERAR), pronto ou não. Fica no card do painel e nas observações.
    '<div class="sec parecer-sec"><div class="stit">seu parecer</div>'+
      '<div id="parecerAtual" class="parecer-atual'+(pr?(' '+(pr.veredito==='aprovado'?'ok':'alt')):' vazio')+'">'+(pr
        ? (pr.veredito==='aprovado'?'✓ Aprovado':'✎ Alteração pedida')+' por '+esc(pr.por||'alguém')+(pr.motivo?': '+esc(pr.motivo):'')+(pr.clickup?' <span class="cu">· task foi pra '+(pr.veredito==='aprovado'?'PUBLICAR':'ALTERAR')+' no ClickUp</span>':(pr.clickupErro?' <span class="cu">· não foi pro ClickUp ('+esc(pr.clickupErro)+')</span>':''))+' <button type="button" class="mudar" id="prMudar">mudar</button>'
        : 'ainda sem parecer')+'</div>'+
      '<form class="obsform" id="prform"'+(pr?' hidden':'')+'>'+
        '<div class="obsrow prbtns"><button type="button" class="prbtn ok" data-v="aprovado">✓ aprovar</button><button type="button" class="prbtn alt" data-v="alterar">✎ pedir alteração</button></div>'+
        '<textarea id="prMotivo" placeholder="o que precisa mudar? (obrigatório ao pedir alteração; opcional ao aprovar)" maxlength="1500"></textarea>'+
        '<p class="nota">Pedir alteração comenta na task e manda ela pra <b>ALTERAR</b> no ClickUp. Aprovar manda pra <b>PUBLICAR</b> (se a task já estava esperando aprovação; se ainda está em produção, fica só registrado). O time é avisado nos dois casos.</p>'+
        '<div class="obsrow"><input id="prNome" maxlength="40" placeholder="seu nome" autocomplete="name"><button type="submit" class="obsenviar" id="prEnviar" disabled>enviar parecer</button></div>'+
        '<div class="obsmsg" id="prMsg"></div>'+
      '</form></div>'+
    '<div class="sec"><div class="stit">observações <span class="n" id="mnotasN"></span></div><div class="notas" id="mnotas"></div>'+
      '<form class="obsform" id="obsform"><textarea id="obsTxt" placeholder="deixe uma observação sobre este post (cai direto na aba Observação do painel)" maxlength="1500"></textarea>'+
      '<div class="obsrow"><input id="obsNome" maxlength="40" placeholder="seu nome" autocomplete="name"><button type="submit" class="obsenviar" id="obsEnviar">enviar observação</button></div><div class="obsmsg" id="obsMsg"></div></form></div>';
  $('#mfoot').innerHTML = s.taskId ? '<a href="https://app.clickup.com/t/'+esc(s.taskId)+'" target="_blank" rel="noopener">'+ICO.link+' ver no ClickUp (se você tiver acesso)</a>' : '';
  try{ $('#obsNome').value = localStorage.getItem('pauta.nome')||''; $('#prNome').value = localStorage.getItem('pauta.nome')||''; }catch(e){}
  atualizaNotas(s);
  $('#obsform').onsubmit = ev=>{ ev.preventDefault(); enviarObs(s); };
  // parecer: escolhe aprovar/reprovar, escreve o motivo, envia
  ST._veredito = null;
  document.querySelectorAll('#prform .prbtn').forEach(btn=>{ btn.onclick=()=>{ ST._veredito=btn.dataset.v; document.querySelectorAll('#prform .prbtn').forEach(x=>x.classList.toggle('on', x===btn)); $('#prEnviar').disabled=false; $('#prMotivo').placeholder = btn.dataset.v==='alterar' ? 'o que precisa mudar? (obrigatório)' : 'algum comentário? (opcional)'; $('#prMotivo').focus(); }; });
  $('#prform').onsubmit = ev=>{ ev.preventDefault(); enviarParecer(s); };
  const mudar=$('#prMudar'); if(mudar) mudar.onclick=()=>{ $('#prform').hidden=false; $('#parecerAtual').classList.add('mudando'); };
  $('#ovPost').classList.add('open');
  if(s.taskId) carregarTask(s);
}
function atualizaNotas(s){
  const el=$('#mnotas'), n=$('#mnotasN'); if(!el) return;
  el.textContent = s.notas||'';
  const q = s.notas ? s.notas.split(/\n\s*\n/).filter(Boolean).length : 0;
  if(n) n.textContent = q ? q : '';
}
async function carregarTask(s){
  try{
    const r=await fetch('/api/pauta/task?'+qs('&id='+encodeURIComponent(s.taskId)),{cache:'no-store'});
    const t=await r.json();
    if(!r.ok || t.semClickUp){ $('#mdesc').innerHTML='<span class="carreg">'+esc(t.erro||'sem conexão com o ClickUp agora')+'</span>'; $('#martes').hidden=true; $('#mresp b').textContent='?'; $('#mdue b').textContent='?'; return; }
    if(ST.aberto!==s.id) return;   // fechou/trocou enquanto carregava
    $('#mresp b').textContent = (t.responsaveis||[]).join(', ') || 'sem responsável';
    $('#mresp b').className='';
    $('#mdue b').textContent = t.due ? new Date(t.due).toLocaleDateString('pt-BR') : 'sem data';
    $('#mdue b').className='';
    $('#mdesc').innerHTML = mdLeve(t.descricao||'');
    const arts=(t.arquivos||[]);
    const g=$('#martesG'); g.innerHTML='';
    if(!arts.length){ $('#martes').hidden=true; }
    else{
      $('#martes').hidden=false; $('#martesN').textContent=arts.length;
      const isImg=f=>/^(png|jpe?g|gif|webp|avif|heic|bmp)$/i.test(f.ext||'')||!!f.thumb;
      const imgs=arts.filter(isImg), outros=arts.filter(f=>!isImg(f));
      ST.artes=imgs; ST.arteIdx=0;
      if(imgs.length){
        g.innerHTML=
          '<div class="viewer">'+
            (imgs.length>1?'<button type="button" class="vnav prev" title="anterior">‹</button>':'')+
            '<img class="vimg" id="vimg" alt="" title="clique pra ver em tela cheia">'+
            (imgs.length>1?'<button type="button" class="vnav next" title="próxima">›</button>':'')+
            '<div class="vcount" id="vcount"></div>'+
            '<div class="vnome" id="vnome"></div>'+
          '</div>'+
          (imgs.length>1?'<div class="vstrip" id="vstrip">'+imgs.map((f,i)=>'<button type="button" class="vth" data-i="'+i+'" title="'+esc(f.name)+'"><img loading="lazy" src="'+esc(img(f.thumb||f.url))+'" alt=""></button>').join('')+'</div>':'');
        // no card vai a versão GRANDE do ClickUp (nítida e leve); a original só na tela cheia.
        const srcCard=f=>img(f.thumbL||f.url);
        const pre=i=>{ const f=imgs[(i+imgs.length)%imgs.length]; if(f && !f._pre){ f._pre=1; const im=new Image(); im.src=srcCard(f); } };
        const mostra=i=>{
          ST.arteIdx=(i+imgs.length)%imgs.length; const f=imgs[ST.arteIdx];
          $('#vimg').src=srcCard(f); $('#vcount').textContent=imgs.length>1?(ST.arteIdx+1)+' / '+imgs.length:''; $('#vnome').textContent=f.name;
          document.querySelectorAll('#vstrip .vth').forEach(b=>b.classList.toggle('on', Number(b.dataset.i)===ST.arteIdx));
          pre(ST.arteIdx+1); pre(ST.arteIdx-1);   // a seta vira instantânea
        };
        mostra(0);
        const pv=g.querySelector('.vnav.prev'), nx=g.querySelector('.vnav.next');
        if(pv) pv.onclick=()=>mostra(ST.arteIdx-1); if(nx) nx.onclick=()=>mostra(ST.arteIdx+1);
        document.querySelectorAll('#vstrip .vth').forEach(b=>b.onclick=()=>mostra(Number(b.dataset.i)));
        $('#vimg').onclick=()=>abrirLb(ST.arteIdx);
      }
      if(outros.length){
        const box=document.createElement('div'); box.className='outros';
        box.innerHTML=outros.map(f=>'<a class="arte file" href="'+esc(img(f.url))+'" target="_blank" rel="noopener" title="'+esc(f.name)+'"><span class="ext">'+esc(f.ext||'arq')+'</span><span class="an">'+esc(f.name)+'</span></a>').join('');
        g.appendChild(box);
      }
    }
  }catch(e){ $('#mdesc').innerHTML='<span class="carreg">não consegui ler a task agora</span>'; }
}
async function enviarObs(s){
  const txt=$('#obsTxt').value.trim(), nome=$('#obsNome').value.trim(), msg=$('#obsMsg'), btn=$('#obsEnviar');
  if(!txt){ msg.textContent='Escreva algo antes de enviar.'; msg.className='obsmsg err'; return; }
  try{ if(nome) localStorage.setItem('pauta.nome', nome); }catch(e){}
  btn.disabled=true; msg.textContent='enviando…'; msg.className='obsmsg';
  try{
    const r=await fetch('/api/pauta/obs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token, aba:ESCOPO, id:s.id, texto:txt, nome})});
    const j=await r.json();
    if(!r.ok){ throw new Error(j.erro||'falhou'); }
    s.notas=j.notas; atualizaNotas(s); $('#obsTxt').value='';
    msg.textContent='Observação salva. Já aparece no painel.'; msg.className='obsmsg ok';
    render(); // atualiza o chip "obs" na lista
  }catch(e){ msg.textContent='Não deu: '+e.message; msg.className='obsmsg err'; }
  finally{ btn.disabled=false; }
}
async function enviarParecer(s){
  const v=ST._veredito, motivo=$('#prMotivo').value.trim(), nome=$('#prNome').value.trim(), msg=$('#prMsg'), btn=$('#prEnviar');
  if(!v){ msg.textContent='Escolha aprovar ou pedir alteração.'; msg.className='obsmsg err'; return; }
  if(v==='alterar' && !motivo){ msg.textContent='Diga o que precisa mudar.'; msg.className='obsmsg err'; $('#prMotivo').focus(); return; }
  try{ if(nome) localStorage.setItem('pauta.nome', nome); }catch(e){}
  btn.disabled=true; msg.textContent='enviando…'; msg.className='obsmsg';
  try{
    const r=await fetch('/api/pauta/parecer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token, aba:ESCOPO, id:s.id, veredito:v, motivo, nome})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.erro||'falhou');
    s.parecer=j.parecer; s.notas=j.notas;
    atualizaNotas(s);
    const at=$('#parecerAtual'); at.className='parecer-atual '+(v==='aprovado'?'ok':'alt');
    const alvo = v==='alterar' ? 'ALTERAR' : 'PUBLICAR';
    at.innerHTML=(v==='aprovado'?'✓ Aprovado':'✎ Alteração pedida')+' por '+esc(nome||'alguém')+(motivo?': '+esc(motivo):'')+(j.clickup?' <span class="cu">· task foi pra '+alvo+' no ClickUp</span>':'')+' <button type="button" class="mudar" id="prMudar">mudar</button>';
    $('#prMudar').onclick=()=>{ $('#prform').hidden=false; };
    $('#prform').hidden=true; $('#prMotivo').value='';
    if(!j.clickup){ msg.textContent = v==='aprovado' ? 'Aprovação registrada. A task não foi pra PUBLICAR: '+(j.clickupErro||'sem detalhe')+'.' : 'Registrado aqui, mas não foi pro ClickUp: '+(j.clickupErro||'sem detalhe')+'.'; msg.className='obsmsg '+(v==='aprovado'?'':'err'); }
    else { msg.textContent=''; }
    if(j.status){ s.statusCache=j.status; }
    render(); // selo na lista
  }catch(e){ msg.textContent='Não deu: '+e.message; msg.className='obsmsg err'; btn.disabled=false; }
}
// ---- sugerir post num dia vazio ----
function abrirSugestao(dia){
  ST.aberto=null;
  const contas=contasDaAba(ST.aba);
  $('#modal').style.setProperty('--cc','#C77DFF');
  $('#mhead').innerHTML='<div class="mtit">💡 Sugerir post pra '+brData(dia)+' · '+DOWS[dow(dia)]+'</div>'+
    '<div class="chips"><span class="pill" style="background:#C77DFF">sugestão</span><span class="chip">'+esc(ST.aba)+'</span></div>';
  $('#mbody').innerHTML=
    '<form class="obsform" id="sugform">'+
      '<textarea id="sugTxt" placeholder="qual a ideia? (tema, gancho, referência… o que ajudar o time a criar)" maxlength="1500" required></textarea>'+
      '<div class="obsrow">'+
        (contas.length>1 ? '<select id="sugConta" class="sel">'+contas.map(k=>'<option value="'+esc(k)+'">'+esc(nomeConta(k))+'</option>').join('')+'</select>' : '<input type="hidden" id="sugConta" value="'+esc(contas[0]||'')+'">')+
        '<select id="sugFmt" class="sel"><option value="">formato (opcional)</option><option value="reels">reels</option><option value="carrossel">carrossel</option><option value="estático">estático</option><option value="story">story</option></select>'+
      '</div>'+
      '<div class="obsrow"><input id="sugNome" maxlength="40" placeholder="seu nome" autocomplete="name"><button type="submit" class="obsenviar" id="sugEnviar">enviar sugestão</button></div>'+
      '<div class="obsmsg" id="sugMsg"></div>'+
    '</form>'+
    '<p class="nota">A sugestão vira um card roxo neste dia, no painel do time e aqui na pauta. O time transforma em post colando a task, ou apaga.</p>';
  $('#mfoot').innerHTML='';
  try{ $('#sugNome').value = localStorage.getItem('pauta.nome')||''; }catch(e){}
  $('#sugform').onsubmit = ev=>{ ev.preventDefault(); enviarSugestao(dia); };
  $('#ovPost').classList.add('open');
  setTimeout(()=>$('#sugTxt').focus(), 60);
}
async function enviarSugestao(dia){
  const txt=$('#sugTxt').value.trim(), nome=$('#sugNome').value.trim(), msg=$('#sugMsg'), btn=$('#sugEnviar');
  if(!txt){ msg.textContent='Escreva a ideia antes de enviar.'; msg.className='obsmsg err'; return; }
  try{ if(nome) localStorage.setItem('pauta.nome', nome); }catch(e){}
  btn.disabled=true; msg.textContent='enviando…'; msg.className='obsmsg';
  try{
    const r=await fetch('/api/pauta/sugestao',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token, aba:ESCOPO, date:dia, conta:$('#sugConta').value, formato:$('#sugFmt').value, texto:txt, nome})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.erro||'falhou');
    msg.textContent='Sugestão enviada. Já está no dia '+brDia(dia)+' no painel do time.'; msg.className='obsmsg ok';
    setTimeout(()=>{ fecharPost(); carregar(); }, 900);
  }catch(e){ msg.textContent='Não deu: '+e.message; msg.className='obsmsg err'; btn.disabled=false; }
}
// ---- tela cheia da arte ----
function abrirLb(i){
  const imgs=ST.artes||[]; if(!imgs.length) return;
  ST.lbIdx=(i+imgs.length)%imgs.length;
  const f=imgs[ST.lbIdx], idx=ST.lbIdx;
  // mostra a versão grande NA HORA (já está no cache do card) e troca pela original quando ela terminar de baixar
  $('#lbimg').src=img(f.thumbL||f.url);
  if(f.thumbL && f.url){ const full=new Image(); full.onload=()=>{ if(ST.lbIdx===idx && $('#lb').classList.contains('open')) $('#lbimg').src=full.src; }; full.src=img(f.url); }
  $('#lbcap').textContent=(imgs.length>1?(ST.lbIdx+1)+' / '+imgs.length+' · ':'')+f.name;
  [idx+1, idx-1].forEach(j=>{ const g=imgs[(j+imgs.length)%imgs.length]; if(g){ const im=new Image(); im.src=img(g.thumbL||g.url); } });
  $('#lbprev').style.display=$('#lbnext').style.display=imgs.length>1?'':'none';
  $('#lb').classList.add('open');
}
function fecharLb(){ $('#lb').classList.remove('open'); }
$('#lbx').onclick=fecharLb;
$('#lbprev').onclick=ev=>{ ev.stopPropagation(); abrirLb(ST.lbIdx-1); };
$('#lbnext').onclick=ev=>{ ev.stopPropagation(); abrirLb(ST.lbIdx+1); };
$('#lb').addEventListener('click', ev=>{ if(ev.target===$('#lb')||ev.target.id==='lbimg') fecharLb(); });
document.addEventListener('keydown', ev=>{
  if(!$('#lb').classList.contains('open')) return;
  if(ev.key==='Escape'){ ev.stopImmediatePropagation(); fecharLb(); }
  if(ev.key==='ArrowLeft') abrirLb(ST.lbIdx-1);
  if(ev.key==='ArrowRight') abrirLb(ST.lbIdx+1);
});
function fecharPost(){ ST.aberto=null; $('#ovPost').classList.remove('open'); }
$('#mclose').onclick=fecharPost;
$('#ovPost').addEventListener('mousedown', ev=>{ if(ev.target===$('#ovPost')) fecharPost(); });
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape' && !$('#lb').classList.contains('open') && $('#ovPost').classList.contains('open')) fecharPost(); });

$('#mPrev').onclick=()=>{ ST.mes=addMes(ST.mes,-1); carregar(); };
$('#mNext').onclick=()=>{ ST.mes=addMes(ST.mes,1); carregar(); };
$('#soProntos').onclick=()=>{ ST.soProntos=!ST.soProntos; render(); };
(function init(){
  const h=lerHash(); ST.aba=ESCOPO||h.aba; ST.mes=h.mes||hojeStr().slice(0,7);
  if(!token){ $('#lista').innerHTML='<div class="erro">Faltou o token no link. Abra pelo link copiado no painel.</div>'; return; }
  carregar();
  setInterval(carregar, 60000);
})();
</script>
